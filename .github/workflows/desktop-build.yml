name: Desktop build

on:
  push:
    paths:
      - "desktop/**"
      - "runtime/**"
      - "server/**"
      - "src/**"
      - "games/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "runtime/**"
      - "server/**"
      - "src/**"
      - "games/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run doctor
      - run: npm run build
      - run: npm run test:runtime
      # electron-builder auto-publishes on CI pushes (and fails without a
      # GH_TOKEN). Releases go to gilfila/anyBot-updates by hand, so CI
      # only builds. latest.yml is still generated with --publish never.
      - run: npm run package -- --publish never
      - run: npm run package:portable -- --publish never
      - run: npm run release:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: anyBot-windows
          path: |
            release/anyBot-Setup-*.exe
            release/anyBot *.exe
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
